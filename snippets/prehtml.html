<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>No-Table CRUD App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .form-box { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .input-group { margin-bottom: 10px; }
        .input-group input, .input-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .task-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; background: #fff; }
        .task-actions { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Manage Tasks</h2>
    
    <!-- Form Box Container for Create / Update input values -->
    <div class="form-box">
        <input type="hidden" id="task-id">
        <div class="input-group">
            <input type="text" id="task-title" placeholder="Task Title">
        </div>
        <div class="input-group">
            <textarea id="task-desc" placeholder="Task Description"></textarea>
        </div>
        <button id="save-btn" onclick="saveTask()">Add Task</button>
        <button id="cancel-btn" style="display:none;" onclick="resetForm()">Cancel</button>
    </div>

    <!-- Main Output Grid Block -->
    <div id="tasks-container"></div>

    <script>
        const apiURI = 'api.php';

        // Load content immediately on page launch
        document.addEventListener("DOMContentLoaded", fetchTasks);

        // READ: Fetch lists asynchronously 
        async function fetchTasks() {
            const res = await fetch(apiURI);
            const tasks = await res.json();
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <h3>${task.title}</h3>
                    <p>${task.description || 'No description provided.'}</p>
                    <div class="task-actions">
                        <button onclick="editTask(${task.id}, '${escapeJs(task.title)}', '${escapeJs(task.description)}')">Edit</button>
                        <button onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // CREATE or UPDATE logic
        async function saveTask() {
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-desc').value;

            if (!title.trim()) return alert('Title is required');

            const isUpdate = id !== "";
            const method = isUpdate ? 'PUT' : 'POST';
            const payload = isUpdate ? { id, title, description } : { title, description };

            const res = await fetch(apiURI, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success || data.id) {
                resetForm();
                fetchTasks();
            }
        }

        // Populates fields when clicking Edit buttons
        function editTask(id, title, desc) {
            document.getElementById('task-id').value = id;
            document.getElementById('task-title').value = title;
            document.getElementById('task-desc').value = desc;
            document.getElementById('save-btn').innerText = 'Update Task';
            document.getElementById('cancel-btn').style.display = 'inline-block';
        }

        // DELETE function execution
        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) return;

            const res = await fetch(apiURI, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });

            const data = await res.json();
            if (data.success) fetchTasks();
        }

        function resetForm() {
            document.getElementById('task-id').value = '';
            document.getElementById('task-title').value = '';
            document.getElementById('task-desc').value = '';
            document.getElementById('save-btn').innerText = 'Add Task';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
