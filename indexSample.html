<!-- Master Contact Selector -->
<div class="form-group">
  <label for="contactID">Select Contact/Member:</label>
  <select id="contactID" name="contactID" class="form-control">
    <option value="">-- Create New Profile --</option>
  </select>
</div>

<!-- Primary Administrative Form -->
<form id="contact-form" novalidate>
  <!-- Hidden input holding the active primary key identifier -->
  <input type="hidden" id="contact_id" name="contact_id" value="">

  <!-- Standard Form Fields -->
  <div class="form-group">
    <label for="first_name">First Name *</label>
    <input type="text" id="first_name" name="first_name" class="form-control">
    <span id="firstError"></span>
  </div>

  <div class="form-group">
    <label for="last_name">Last Name *</label>
    <input type="text" id="last_name" name="last_name" class="form-control">
    <span id="lastError"></span>
  </div>

  <div class="form-group">
    <label for="c_email">Email Address</label>
    <input type="email" id="c_email" name="c_email" class="form-control">
    <span id="emailError"></span>
  </div>

  <!-- Membership Status Trigger Flag -->
  <div class="form-group">
    <label for="is_member">Is a Member?</label>
    <select id="is_member" name="is_member" class="form-control">
      <option value="0">No (Regular Contact)</option>
      <option value="1">Yes (Church Member)</option>
    </select>
  </div>

  <!-- DYNAMIC MINISTRY ALLIANCES AREA (Two-Column Layout Layout) -->
  <div id="ministry-section" style="display: none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px;">
    <h3>Ministry Alliances Assignment</h3>
    
    <!-- CSS Grid Container splitting items into 2 equal-width tracks -->
    <div id="checkbox-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px 30px;">
      <!-- jQuery dynamically drops card rows in here -->
    </div>
  </div>

  <!-- Submission Interface Block Buttons -->
  <div style="margin-top: 20px;">
    <button type="submit" id="submitBtn" class="btn btn-primary">Save & Continue</button>
    <button type="button" id="resetBtn" class="btn btn-secondary" style="display: none;">Reset Form</button>
  </div>

  <div id="responseMsg" style="margin-top: 10px;"></div>
</form>
